<h2>Documentos Fiscais</h2>
<div class="content-block">
  <!-- Container Pai & Abaixo do Título -->
  <div class="dx-card responsive-paddings">

    <!-- Topo da Página -->
    <section class="documentos-add">
      <dx-button
      text="Novo"
      (onClick)="createDocumento()"
      ></dx-button>
    </section>

    <!-- Listagem de Documentos -->
    <section class="documentos-lista">
      <dx-data-grid
      [dataSource]=""
      ></dx-data-grid>
    </section>
  </div>
</div>
