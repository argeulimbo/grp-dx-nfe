<h1>Criar Nota Fiscal</h1>

<div class="content-block">
  <!-- Container Pai & Abaixo do Título -->
  <div class="dx-card responsive-paddings">

    <!-- Form Nota Fiscal -->
    <section>
    <dx-form id="nota-fiscal-form"
      [formData]="nota"
      >
      <!-- Dados Nota Fiscal Text -->
      <dxi-item itemType="group" caption="Dados Nota Fiscal"/>

      <!-- NF Nota -->
      <dxi-item dataField="numero" [isRequired]="true">
        <dxo-label text="Número da Nota"></dxo-label>
      </dxi-item>

       <!-- Cliente com Seleção e Busca -->
      <dxi-item [isRequired]="true">
        <dxo-label text="Cliente"></dxo-label>
        <div *dxTemplate>
          <dx-select-box
            [dataSource]="clientes"
            displayExpr="nome"
            valueExpr="id"
            [(value)]="nota.codigoCliente"
            [searchEnabled]="true"
            searchMode="contains"
            placeHolder="Digite para buscar o cliente..."
            [noDataText]="'Nenhum cliente encontrado'"/>
        </div>
      </dxi-item>



    </dx-form>
    </section>
  </div>
</div>
