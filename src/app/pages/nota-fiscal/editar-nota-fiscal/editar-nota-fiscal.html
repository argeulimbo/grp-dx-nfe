<h1>Editar Nota Fiscal</h1>

<div class="content-block">
  <div class="dx-card responsive-paddings">
    <section>
      <!-- Botão Voltar -->
      <dx-button
        text="Voltar"
        icon="arrowleft"
        routerLink="/nfe/notas">
      </dx-button>

      <!-- Imagem da Nota -->
      <div class="img-div">
        <img src="/nf.png" alt="nota-image">
      </div>

      <!-- Form Nota Fiscal -->
      <dx-form [formData]="nota">
        <dxi-item itemType="group" caption="Dados Nota Fiscal" [colCount]="2">

          <dxi-item dataField="numero" [isRequired]="true">
            <dxo-label text="Número da Nota"></dxo-label>
          </dxi-item>

          <dxi-item [isRequired]="true" template="clienteSelectTemplate">
            <dxo-label text="Cliente"></dxo-label>
          </dxi-item>

          <dxi-item dataField="dataEmissao" editorType="dxDateBox" [isRequired]="true" [editorOptions]="{ displayFormat: 'dd/MM/yyyy' }">
            <dxo-label text="Data de Emissão"></dxo-label>
          </dxi-item>

          <dxi-item dataField="valorTotal" editorType="dxNumberBox" [editorOptions]="{ readOnly: true, format: 'R$ #,##0.00' }">
            <dxo-label text="Valor Total"></dxo-label>
          </dxi-item>

        </dxi-item>

        <!-- SelectBox de Cliente -->
        <div *dxTemplate="let data of 'clienteSelectTemplate'">
          <dx-select-box class="clientes-select-box"
                         [dataSource]="clientes"
                         displayExpr="nome"
                         valueExpr="id"
                         [(value)]="nota.cliente!.id"
                         [searchEnabled]="true"
                         placeholder="Digite para buscar o cliente..."
                         noDataText="Nenhum cliente encontrado">
            <div *dxTemplate="let data of 'dropDownButton'">
              <i class="dx-icon-user"></i>
            </div>
          </dx-select-box>
        </div>
      </dx-form>

      <hr />

      <!-- Tabela de Itens -->
      <h3>Itens</h3>

      <dx-data-grid
        [dataSource]="nota.itens"
        [showBorders]="true"
        (onRowInserted)="atualizarValorTotal()"
        (onRowUpdated)="atualizarValorTotal()"
        (onRowRemoved)="atualizarValorTotal()">

        <dxo-editing
          mode="cell"
          [allowAdding]="true"
          [allowUpdating]="true"
          [allowDeleting]="true">
        </dxo-editing>

        <!-- Coluna Produto  -->
        <dxi-column dataField="produto.id" caption="Produto">
          <dxo-lookup
            [dataSource]="produtos"
            displayExpr="descricao"
            valueExpr="id"
            searchMode="contains">
          </dxo-lookup>
        </dxi-column>

        <!-- Valor Unitário -->
        <dxi-column dataField="produto.valorUnitario" caption="Vlr. Unit" [format]="'R$ #,##0.00'">
        </dxi-column>

        <!-- Quantidade -->
        <dxi-column dataField="quantidade" caption="Quantidade" dataType="number">
        </dxi-column>

      </dx-data-grid>

      <br />

      <!-- Botões de Ação -->
      <div class="div-bt">
        <dx-button text="Salvar" type="success" (onClick)="editarNota(nota)"></dx-button>
        <dx-button text="Cancelar" type="danger" routerLink="/nfe/notas"></dx-button>
      </div>

    </section>
  </div>
</div>
